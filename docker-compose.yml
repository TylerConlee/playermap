services:
    playermap:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        environment:
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            GAME_SERVER_WAN_ADDR: ${GAME_SERVER_WAN_ADDR}
            # Fixed 2026-08-13: this was missing entirely, even though the
            # config.php code reads it via getenv('GAME_SERVER_HOST'). A
            # variable existing in .env does NOT automatically become a
            # container env var -- only ones explicitly listed here do.
            # Without it, getenv() returned empty, fsockopen() failed
            # instantly, and the "server online" status check always showed
            # offline -- completely independent of the character DB query,
            # which worked the whole time (confirmed via real bot data
            # showing up in the online-players payload despite the status
            # flag being wrong).
            GAME_SERVER_HOST: ${GAME_SERVER_HOST}
        networks:
            - ac-network
        ports:
            - "48734:80"

networks:
    ac-network:
        # Same pattern as the azerothcore-armory fork: attaches to the
        # existing azerothcore stack's network by name rather than creating
        # its own, so playermap can reach ac-database by Docker service name.
        name: ${DOCKER_AC_NETWORK_NAME:-azerothcore_default}
        external: ${DOCKER_AC_NETWORK_EXTERNAL:-true}
